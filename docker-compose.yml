version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: everflowcfo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: everflow
      POSTGRES_PASSWORD: everflow_secure_2024
      POSTGRES_DB: everflowcfo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everflow -d everflowcfo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: everflowcfo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
